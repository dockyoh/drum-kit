<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/drum-kit.css" />
    <title>Drum Kit</title>
  </head>
  <body>
    <header></header>
    <main>
      <section class="keys-container">
        <div class="key" data-key="a">
          <h1 class="key-letter">A</h1>
          <p class="key-instrument">Boom</p>
        </div>
        <div class="key">
          <h1 class="key-letter">S</h1>
          <p class="key-instrument">Clap</p>
        </div>
        <div class="key">
          <h1 class="key-letter">D</h1>
          <p class="key-instrument">Hihat</p>
        </div>
        <div class="key">
          <h1 class="key-letter">F</h1>
          <p class="key-instrument">Kick</p>
        </div>
        <div class="key">
          <h1 class="key-letter">G</h1>
          <p class="key-instrument">Openhat</p>
        </div>
        <div class="key">
          <h1 class="key-letter">H</h1>
          <p class="key-instrument">Ride</p>
        </div>
        <div class="key">
          <h1 class="key-letter">J</h1>
          <p class="key-instrument">Snare</p>
        </div>
        <div class="key">
          <h1 class="key-letter">K</h1>
          <p class="key-instrument">Tink</p>
        </div>
        <div class="key">
          <h1 class="key-letter">L</h1>
          <p class="key-instrument">Tom</p>
        </div>
      </section>
      <section class="audio-container">
        <audio src="sounds/boom.mp3" data-key="a"></audio>
      </section>
    </main>
    <footer></footer>
    <script type="module" src="scripts/drum-kit-main.js"></script>
  </body>
</html>
